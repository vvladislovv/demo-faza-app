:root{--bg:#EEF1F4;--surf:#FFFFFF;--surf2:#F4F6F8;--ink:#111A24;--mute:#5B6877;--line:#DCE2E8;--cu:#B35A1B;--cuink:#FFFFFF;--cusoft:#F8E8DA;--blue:#2A5BD0;--bluesoft:#E3EBFB;--ok:#3F8A2B;--oksoft:#E2F0DC;--busy:#8A94A0;--map:#E4EAEE;--street:#FFFFFF;--water:#BDD5E9;--park:#CDE2C2;--shadow:rgba(17,26,36,.16);--font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1117;--surf:#141D27;--surf2:#1A2530;--ink:#E8EDF2;--mute:#93A1B0;--line:#263341;--cu:#EA9453;--cuink:#1A0F06;--cusoft:#3A2515;--blue:#86A7F4;--bluesoft:#1B2A4A;--ok:#7CC768;--oksoft:#1E3320;--busy:#6E7A87;--map:#18222C;--street:#222F3B;--water:#1F3A52;--park:#1E3524;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1117;--surf:#141D27;--surf2:#1A2530;--ink:#E8EDF2;--mute:#93A1B0;--line:#263341;--cu:#EA9453;--cuink:#1A0F06;--cusoft:#3A2515;--blue:#86A7F4;--bluesoft:#1B2A4A;--ok:#7CC768;--oksoft:#1E3320;--busy:#6E7A87;--map:#18222C;--street:#222F3B;--water:#1F3A52;--park:#1E3524;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{max-width:1080px;margin:0 auto 22px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.brand svg{width:34px;height:34px}
.brand small{font-weight:500;font-size:12px;color:var(--mute);background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ghost{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.ghost[aria-pressed="true"]{border-color:var(--cu);color:var(--cu)}
.stage{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;align-items:start}
.phone{width:100%;max-width:410px;height:790px;margin-inline:auto;background:var(--surf);border:1px solid var(--line);border-radius:46px;box-shadow:0 0 0 9px var(--surf2),0 30px 60px -20px var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.appbar{display:flex;align-items:center;gap:10px;padding:20px 20px 10px}
.appbar b{font-size:20px;letter-spacing:-.01em}
.appbar span{font-size:12.5px;color:var(--mute)}
.appbar .who{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--bluesoft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px;position:relative;scrollbar-width:thin}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surf);padding:6px 6px 14px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mute);padding:6px 0;border-radius:12px;position:relative}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-selected="true"]{color:var(--cu)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;position:relative}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--cusoft);border-color:var(--cu);color:var(--cu)}
.chiplabel{font-size:12px;color:var(--mute);margin:2px 0 4px;font-weight:600}
.map{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin:4px 0 12px}
.map svg{display:block;width:100%;height:auto}
.map .note{position:absolute;left:8px;bottom:6px;font-size:10.5px;color:var(--mute);background:color-mix(in srgb,var(--surf) 80%,transparent);padding:1px 6px;border-radius:6px}
.mpin{cursor:pointer}
.mpin circle{stroke:var(--surf);stroke-width:2.5}
.mpin text{font:700 9px var(--font);fill:#fff;text-anchor:middle;pointer-events:none}
.list{display:flex;flex-direction:column;gap:9px;position:relative}
.card{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:var(--surf);text-align:left;width:100%}
.card[aria-current="true"]{border-color:var(--cu);background:var(--cusoft)}
.ava{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.card .m{min-width:0;flex:1}
.card b{display:block;font-size:15px}
.card .sub,.card .rate{display:block}
.card .sub{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.st.free{background:var(--oksoft);color:var(--ok)}
.st.busy{background:var(--surf2);color:var(--mute)}
.rate{font-size:12.5px;color:var(--mute)}
h3{margin:14px 0 8px;font-size:16px;letter-spacing:-.005em}
.search{display:flex;gap:8px;margin:2px 0 10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surf2);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit;font-size:14.5px}
.btn{border:0;background:var(--cu);color:var(--cuink);border-radius:14px;padding:11px 16px;font-weight:700;font-size:14.5px}
.btn.alt{background:var(--ink);color:var(--bg)}
.btn.line{background:var(--surf);border:1px solid var(--line);color:var(--ink)}
.ans{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--surf2);position:relative}
.ans .q{font-weight:600;margin:0 0 8px}
.ans p{margin:0 0 8px;font-size:14px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ref{font-size:12px;font-weight:600;padding:4px 9px;border-radius:9px;background:var(--bluesoft);color:var(--blue)}
.demo{font-size:11.5px;color:var(--mute);margin-top:8px}
.doc{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border:0}
.doc .ic{flex:none;width:40px;height:48px;border-radius:8px;background:var(--bluesoft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:11px}
.doc b{display:block;font-size:14.5px}
.doc span{font-size:13px;color:var(--mute)}
mark{background:var(--cusoft);color:var(--cu);border-radius:3px;padding:0 2px}
.calc label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:10px 0 4px}
.calc input,.calc select{width:100%;border:1px solid var(--line);background:var(--surf2);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-family:var(--mono);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{margin-top:14px;border-radius:18px;padding:16px;background:var(--ink);color:var(--bg)}
.res small{display:block;font-size:12.5px;opacity:.75}
.res strong{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em}
.res em{font-style:normal;font-size:12.5px;opacity:.75;display:block;margin-top:4px}
.chat{display:flex;flex-direction:column;height:100%;position:relative}
.chat .head{display:flex;align-items:center;gap:10px;padding:2px 0 10px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 0}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14px;background:var(--surf2)}
.msg.me{align-self:flex-end;background:var(--cu);color:var(--cuink)}
.msg time{display:block;font-size:10.5px;opacity:.6;margin-top:2px}
.send{display:flex;gap:8px;padding-top:8px}
.send input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surf2);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit;font-size:14.5px}
.sheet{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--surf);width:100%;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px 22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.tile{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:11.5px;font-weight:600;color:#fff;position:relative;overflow:hidden}
.tile svg{position:absolute;right:6px;top:6px;width:30px;height:30px;opacity:.9}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surf2);color:var(--mute)}
textarea{width:100%;border:1px solid var(--line);background:var(--surf2);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit;font-size:14.5px;resize:vertical;min-height:84px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:16px;margin:6px 0}
.sw{width:46px;height:28px;border-radius:999px;border:0;background:var(--busy);position:relative;padding:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--ok)}
.sw[aria-pressed="true"]::after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--cu)}
.guide{position:sticky;top:16px;background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:22px 22px 14px}
.guide h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.guide p{margin:0 0 12px;color:var(--mute);font-size:14px}
.guide ol{list-style:none;margin:0;padding:0}
.guide li button{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 8px;border-radius:14px}
.guide li button:hover{background:var(--surf2)}
.guide li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--cu);color:var(--cuink);display:grid;place-items:center;font:700 12px var(--font);font-style:normal;margin-top:1px}
.guide li b{display:block;font-size:14.5px}
.guide li span{display:block;font-size:13px;color:var(--mute)}
.guide .foot{border-top:1px solid var(--line);margin-top:8px;padding:12px 8px 6px;font-size:13px;color:var(--mute)}
.pin{display:none;position:absolute;z-index:3;width:21px;height:21px;border-radius:50%;background:var(--cu);color:var(--cuink);font:700 11.5px var(--font);font-style:normal;place-items:center;box-shadow:0 0 0 3px var(--surf);pointer-events:none}
body.hints .pin{display:grid}
.tabs .pin{top:-1px;left:calc(50% + 4px)}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr);gap:26px}.guide{position:static}}
@media (max-width:480px){.phone{border-radius:30px;height:760px;box-shadow:0 0 0 5px var(--surf2)}.top{gap:10px}.seg button{padding:7px 11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="brand">
    <svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="var(--ink)"/><path d="M10 21h5l2-8 3 12 2-6h3" fill="none" stroke="var(--cu)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="bn">Фаза</span> <small id="demotag">демо-данные</small>
  </div>
  <div class="acts" style="position:relative">
    <i class="pin" data-n="1" style="left:-8px;top:-9px">1</i>

    <div class="seg" role="group" aria-label="Язык"><button type="button" data-lang="ru" aria-pressed="true">RU</button><button type="button" data-lang="es" aria-pressed="false">ES</button></div>

  </div>
</header>

<main class="stage">
  <section class="phone" aria-label="Приложение">
    <div class="appbar"><b id="ab">Фаза</b><span id="city">Мадрид</span><div class="who" id="who">АП</div></div>
    <div class="screen" id="screen"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </section>
  <aside class="guide" id="guide">
    <h2 id="gt">Что где в демо</h2>
    <p id="gp">Нажмите на пункт, и демо откроет этот экран.</p>
    <ol id="gl"></ol>
    <div class="foot" id="gf"></div>
  </aside>
</main>

  '<div class="grid2"><div><label for="cs">'+esc(L.sec)+'</label><select id="cs" data-k="S">'+[1.5,2.5,4,6,10,16].map(function(v){return '<option value="'+v+'"'+(c.S===v?" selected":"")+'>'+fmt(v,1)+'</option>'}).join("")+'</select></div><div><label for="cp">'+esc(L.loop)+'</label><select id="cp" data-k="loop"><option value="0"'+(c.loop?"":" selected")+'>1×</option><option value="1"'+(c.loop?" selected":"")+'>2×</option></select></div></div>'}
 else{body='<div class="grid2"><div><label for="cv1">'+esc(S.calc==="kwA"?L.power:L.curr)+'</label><input id="cv1" data-k="'+(S.calc==="kwA"?"P":"I")+'" type="number" inputmode="decimal" step="0.1" min="0" value="'+(S.calc==="kwA"?c.P:c.I)+'"></div><div><label for="cu1">'+esc(L.volt)+'</label><select id="cu1" data-k="U"><option value="230"'+(c.U===230?" selected":"")+'>230</option><option value="400"'+(c.U===400?" selected":"")+'>400</option></select></div></div>'+
  '<div class="grid2"><div><label for="cph">'+esc(L.phase)+'</label><select id="cph" data-k="ph"><option value="1"'+(c.ph===1?" selected":"")+'>'+esc(L.p1)+'</option><option value="3"'+(c.ph===3?" selected":"")+'>'+esc(L.p3)+'</option></select></div><div><label for="cco">'+esc(L.cos)+'</label><select id="cco" data-k="cos">'+[1,0.95,0.9,0.8].map(function(v){return '<option value="'+v+'"'+(c.cos===v?" selected":"")+'>'+fmt(v,2)+'</option>'}).join("")+'</select></div></div>'}
 return '<div class="calc"><h3 style="margin-top:2px">'+esc(L.calcT)+'</h3>'+seg+body+'<div class="res" id="res">'+calcOut()+'</div></div>'}

function partner(){var L=lang();if(S.role==="pro")return{k:"client",n:L.clientName,ini:"АП",c:"#2A5BD0"};var p=PRO.filter(function(x){return x.id===S.sel})[0];return{k:p.id,n:p.n,ini:p.ini,c:p.c}}
function thread(){var pr=partner(),L=lang();if(!S.chat[pr.k]){var m0=L.chat0;S.chat[pr.k]=[{me:S.role==="client",t:m0[0],tm:"10:12"},{me:S.role!=="client",t:m0[1],tm:"10:20"}]}return S.chat[pr.k]}
function viewChat(){var L=lang(),pr=partner(),th=thread();
 return '<div class="chat" style="min-height:560px"><div class="head" style="position:relative">'+pin(7,"left:-6px;top:-8px")+'<span class="ava" style="background:'+pr.c+'">'+pr.ini+'</span><div><b>'+esc(pr.n)+'</b><div class="rate">'+esc(L.chatWith)+'</div></div></div><div class="msgs" id="msgs">'+th.map(function(m){return '<div class="msg'+(m.me?" me":"")+'">'+esc(m.t)+'<time>'+m.tm+'</time></div>'}).join("")+'</div><form class="send" id="sendf"><input id="msgin" placeholder="'+esc(L.msgPh)+'" aria-label="'+esc(L.msgPh)+'" autocomplete="off"><button class="btn" type="submit">'+esc(L.sendB)+'</button></form></div>'}

function viewProfile(){var L=lang();
 var h='<h3 style="margin-top:2px;position:relative">'+pin(8)+'<span style="margin-left:'+(S.hints?"24px":"0")+'">'+esc(L.profT)+'</span></h3><div class="card" style="cursor:default"><span class="ava" style="background:#2A5BD0">АГ</span><span class="m"><b>Алексей Громов</b><span class="sub">'+esc(L.pro)+'</span></span></div>'+
 '<div class="toggle"><div><b>'+esc(L.status)+'</b><div class="rate">'+esc(L.statusHint)+'</div></div><button class="sw" id="sw" type="button" aria-pressed="'+S.free+'" aria-label="'+esc(L.status)+'"></button></div>'+
 '<label class="chiplabel" for="rad" style="display:block;margin-top:12px">'+esc(L.radius)+': <b id="radv">'+S.rad+'</b> '+esc(L.km)+'</label><input id="rad" type="range" min="5" max="80" step="5" value="'+S.rad+'">'+
 '<label class="chiplabel" for="abt" style="display:block;margin-top:12px">'+esc(L.about)+'</label><textarea id="abt">'+esc(L.aboutTxt)+'</textarea>'+
 '<h3>'+esc(L.myWorks)+'</h3><div class="tiles" id="mw">'+PRO[1].wk.map(function(w){return tile(w.t[S.lang],w.k)}).join("")+S.myW.map(function(w){return tile(w,"small")}).join("")+'</div>'+
 '<h3>'+esc(L.addW)+'</h3><textarea id="wd" placeholder="'+esc(L.wPh)+'" aria-label="'+esc(L.wDesc)+'"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn line" type="button" disabled style="opacity:.7">'+esc(L.photo)+'</button><button class="btn" id="wadd" type="button" style="flex:1">'+esc(L.wAdd)+'</button></div>';
 return h}

function renderGuide(){var L=lang();$("#gt").textContent=L.guideT;$("#gp").textContent=L.guideP;$("#gf").textContent=L.gfoot;
 $("#gl").innerHTML=L.g.map(function(g,i){return '<li><button type="button" data-g="'+(i+1)+'"><i>'+(i+1)+'</i><span><b>'+esc(g[0])+'</b><span>'+esc(g[1])+'</span></span></button></li>'}).join("")}
function renderTop(){var L=lang();$("#bn").textContent=$("#ab").textContent=S.lang==="ru"?"Фаза":"Fase";$("#demotag").textContent=L.demo;$("#city").textContent=L.city;$("#rClient").textContent=L.client;$("#rPro").textContent=L.pro;$("#hintbtn").textContent=L.hints;
 document.querySelectorAll("[data-role]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.role===S.role)});
 document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===S.lang)});
 document.documentElement.lang=S.lang;$("#who").textContent=S.role==="client"?"АП":"АГ"}

function render(){renderTop();renderTabs();renderGuide();
 var v=S.tab==="map"?viewMap():S.tab==="norms"?viewNorms():S.tab==="calc"?viewCalc():S.tab==="chat"?viewChat():viewProfile();
 var sc=$("#screen");sc.innerHTML=v;
 var ph=$(".phone");var old=ph.querySelector(".sheet");if(old)old.remove();
 if(S.sheet){var p=PRO.filter(function(x){return x.id===S.sheet})[0];ph.insertAdjacentHTML("beforeend",sheetHtml(p))}
 if(S.tab==="chat"){var m=$("#msgs");if(m)m.scrollTop=m.scrollHeight}}

function setTab(t){S.tab=t;S.sheet=null;render()}
function guideTo(n){var map={1:function(){S.role="client";S.tab="map"},2:function(){S.role="client";S.tab="map"},3:function(){S.role="client";S.tab="map"},4:function(){S.role="client";S.tab="map";S.sheet="s1"},5:function(){S.tab="norms";S.ask=true},6:function(){S.tab="calc"},7:function(){S.tab="chat"},8:function(){S.role="pro";S.tab="profile"}};
 if(n===5||n===6||n===7){if(S.role==="pro"&&n!==8){}}
 map[n]();if(S.role==="pro"&&S.tab==="map")S.tab="profile";S.sheet=n===4?"s1":null;render();if(window.innerWidth<=900&&n!==1)$(".phone").scrollIntoView({behavior:"smooth",block:"start"})}

document.addEventListener("click",function(e){
 var b=e.target.closest("button,[data-pro]");if(!b){if(e.target.dataset&&e.target.dataset.close){S.sheet=null;render()}return}
 if(b.id==="hintbtn"){S.hints=!S.hints;document.body.classList.toggle("hints",S.hints);b.setAttribute("aria-pressed",S.hints);$("#guide").hidden=!S.hints;return}
 if(b.dataset.role){S.role=b.dataset.role;S.tab=S.role==="client"?"map":"profile";S.sheet=null;render();return}
 if(b.dataset.lang){S.lang=b.dataset.lang;S.chat={};render();return}
 if(b.dataset.tab){setTab(b.dataset.tab);return}
 if(b.dataset.f){S[b.dataset.f]=b.dataset.v;var sc=$(".chips");render();return}
 if(b.dataset.pro){S.sel=b.dataset.pro;render();var c=$('[data-open="'+S.sel+'"]');if(c)c.scrollIntoView({block:"nearest"});return}
 if(b.dataset.open){S.sel=b.dataset.open;S.sheet=b.dataset.open;render();return}
 if(b.dataset.closebtn){S.sheet=null;render();return}
 if(b.dataset.chatwith){S.sel=b.dataset.chatwith;S.sheet=null;S.tab="chat";render();return}
 if(b.dataset.calc){S.calc=b.dataset.calc;render();return}
 if(b.dataset.g){guideTo(+b.dataset.g);return}
 if(b.id==="askbtn"){S.ask=true;S.q=$("#askin").value;render();return}
 if(b.id==="sw"){S.free=!S.free;b.setAttribute("aria-pressed",S.free);return}
 if(b.id==="wadd"){var t=$("#wd").value.trim();if(t){S.myW.push(t);S.tab="profile";render();var mw=$("#mw");if(mw)mw.lastElementChild.scrollIntoView({block:"nearest"})}return}
});
document.addEventListener("input",function(e){var t=e.target;
 if(t.id==="docin"){S.docq=t.value;var pos=t.selectionStart;render();var n=$("#docin");n.focus();n.setSelectionRange(pos,pos);return}
 if(t.id==="rad"){S.rad=+t.value;$("#radv").textContent=t.value;return}
 if(t.dataset&&t.dataset.k){var k=t.dataset.k,v=t.value;if(k==="mat")S.cv.mat=v;else if(k==="loop")S.cv.loop=v==="1";else S.cv[k]=parseFloat(v)||0;$("#res").innerHTML=calcOut()}});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset&&t.dataset.k){var k=t.dataset.k;if(k==="U"||k==="ph"||k==="cos"||k==="S")S.cv[k]=parseFloat(t.value);if(k==="mat")S.cv.mat=t.value;if(k==="loop")S.cv.loop=t.value==="1";$("#res").innerHTML=calcOut()}});
document.addEventListener("keydown",function(e){var g=e.target.closest&&e.target.closest("[data-pro]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();g.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
document.addEventListener("submit",function(e){if(e.target.id!=="sendf")return;e.preventDefault();var i=$("#msgin"),v=i.value.trim();if(!v)return;
 var th=thread(),L=lang();th.push({me:true,t:v,tm:"10:3"+(th.length%10)});i.value="";var key=partner().k;render();$("#msgin").focus();
 setTimeout(function(){if(S.chat[key]){S.chat[key].push({me:false,t:L.reply[Math.floor(Math.random()*L.reply.length)],tm:"10:4"+(S.chat[key].length%10)});if(S.tab==="chat"&&partner().k===key){render()}}},900)});
document.body.classList.add("hints");render();
})();
</script>

</html>
