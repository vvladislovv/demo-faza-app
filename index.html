<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EEF0F5">
<title>Приложение Фаза</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet"></noscript>
<style>
/* Фаза: светлый и воздушный интерфейс. Основа белая, один сигнальный цвет (жёлтый, как изолента электрика),
   чернила для текста и главных переключателей. Заголовки Unbounded, текст Manrope. */
:root{color-scheme:light;--bg:#EEF0F5;--surf:#FFFFFF;--surf2:#F5F6FA;--ink:#12141C;--mute:#6A7081;--line:#E8EAF0;--volt:#FFD21F;--voltsoft:#FFF4C2;--ok:#16915A;--oksoft:#E2F5EB;--blue:#3558FF;--bluesoft:#ECF0FF;--busy:#A3A8B6;--map:#EDF1F8;--street:#FFFFFF;--water:#D3E5F7;--park:#DCF0E2;--shadow:rgba(18,20,28,.16);--scrim:rgba(18,20,28,.4);
 --ease:cubic-bezier(.22,1,.36,1);--font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--display:'Unbounded','Manrope',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--font);padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h3{margin:22px 0 10px;font-size:16px;font-weight:700;letter-spacing:-.005em}
.ttl{margin:4px 0 16px;font:600 22px/1.2 var(--display);letter-spacing:-.03em}
[hidden]{display:none!important}

/* шапка страницы */
.top{max-width:1320px;margin:0 auto 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:600 19px var(--display);letter-spacing:-.03em;margin-right:auto}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:none}
.brand small{font:600 12px var(--font);letter-spacing:0;color:var(--mute);background:var(--surf);border-radius:999px;padding:4px 11px}
.seg{--n:2;--i:0;position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surf2);border-radius:14px;padding:3px}
.top .seg{background:var(--surf)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:11px;background:var(--ink);transform:translateX(calc(var(--i)*100%));transition:transform .32s var(--ease)}
.seg button{position:relative;border:0;background:none;padding:8px 16px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute);white-space:nowrap;min-height:38px;transition:color .2s}
.seg button[aria-pressed="true"]{color:#fff}
.ghost{border:0;background:var(--surf);border-radius:14px;padding:0 16px;min-height:44px;font-weight:700;font-size:14px;white-space:nowrap;transition:background-color .2s,transform .15s var(--ease)}
.ghost[aria-pressed="true"]{background:var(--volt)}
.ghost:active,.btn:active,.card:active,.chip:active,.tab:active{transform:scale(.97)}

/* раскладка */
.stage{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
body.guide-off .stage{grid-template-columns:minmax(0,1fr)}
body.guide-off .guide{display:none}
.device{display:block}
.app{position:relative;width:100%;height:calc(100dvh - 112px);min-height:620px;display:flex;flex-direction:column;overflow:hidden;background:var(--surf);border-radius:32px;box-shadow:0 30px 60px -40px var(--shadow)}
.appbar{display:flex;align-items:center;gap:10px;padding:22px 22px 8px;flex:none}
.appbar b{font:600 18px var(--display);letter-spacing:-.03em}
.appbar .city{font-size:12.5px;font-weight:700;color:var(--ink);background:var(--surf2);padding:4px 11px;border-radius:999px}
.appbar .demo{display:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:700;color:var(--mute);background:var(--surf2);padding:3px 10px;border-radius:999px}
.appbar .city{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hq{display:none;font:800 18px var(--font)}
.who{flex:none;margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--volt);display:grid;place-items:center;font-weight:800;font-size:13px}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:10px 20px 28px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen[data-tab="chat"]{overflow:hidden;display:flex;flex-direction:column;padding-bottom:10px}
.screen.fwd{animation:in-fwd .38s var(--ease)}
.screen.back{animation:in-back .38s var(--ease)}
.screen.fade{animation:in-fade .3s ease}
@keyframes in-fwd{from{opacity:0;transform:translateX(22px)}}
@keyframes in-back{from{opacity:0;transform:translateX(-22px)}}
@keyframes in-fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}

/* нижнее меню: активную вкладку держит жёлтая «таблетка» */
.tabbar{position:relative;flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surf);box-shadow:0 -1px 0 var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tabbar .ind{position:absolute;top:10px;left:6px;width:calc((100% - 12px)/4);height:32px;display:grid;place-items:center;transition:transform .4s var(--ease);pointer-events:none}
.tabbar .ind::after{content:"";width:60px;height:32px;border-radius:16px;background:var(--volt)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--mute);padding:10px 0 4px;min-height:62px;border-radius:12px;transition:color .2s,transform .15s var(--ease)}
.tab svg{width:23px;height:23px;position:relative;transition:color .2s}
.tab[aria-selected="true"]{color:var(--ink)}

/* фильтры, карта, список */
.flabel{font-size:12.5px;font-weight:700;color:var(--mute);margin:6px 0 6px}
.chipwrap{position:relative;margin:0 -20px 8px}
.chipwrap::after{content:"";position:absolute;top:0;right:0;bottom:0;width:34px;background:linear-gradient(90deg,transparent,var(--surf));pointer-events:none;transition:opacity .2s}
.chipwrap.end::after{opacity:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:0;background:var(--surf2);border-radius:999px;padding:0 16px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;transition:background-color .2s,color .2s,transform .15s var(--ease)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.map{position:relative;border-radius:26px;overflow:hidden;margin:12px 0 20px;background:var(--map);box-shadow:inset 0 0 0 1px rgba(18,20,28,.06)}
.map svg{display:block;width:100%;height:auto}
.note{position:absolute;left:10px;bottom:8px;font-size:10.5px;font-weight:600;color:var(--mute);background:rgba(255,255,255,.85);padding:2px 8px;border-radius:8px}
.mpin{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .2s var(--ease)}
.mpin:hover{transform:scale(1.12)}
.mpin circle{stroke:#fff;stroke-width:3}
.mpin text{font:800 9px var(--font);fill:#fff;text-anchor:middle;pointer-events:none}
.mpin.sel text{fill:var(--ink)}
.mpin.sel{animation:pinpop .4s var(--ease)}
.mlabel{pointer-events:none;animation:fade .3s .1s both}
.mlabel rect{fill:var(--ink)}
.mlabel text{font:700 10.5px var(--font);fill:#fff;text-anchor:middle}
.zone{transform-box:fill-box;transform-origin:center;animation:zone .5s var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes pinpop{50%{transform:scale(1.2)}}
@keyframes zone{from{opacity:0;transform:scale(.4)}}
.count{margin:2px 0 12px;font-size:15px;font-weight:700;color:var(--mute)}
.count i{font:600 15px var(--display);font-style:normal;color:var(--ink);margin-left:4px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border:0;border-radius:24px;background:var(--surf2);transition:background-color .2s,box-shadow .2s,transform .15s var(--ease)}
.card[aria-current="true"]{background:var(--voltsoft);box-shadow:inset 0 0 0 2px var(--volt)}
.card.stag{animation:pop .36s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@media (hover:hover){.card[data-act]:hover{background:#ECEEF5}.card[aria-current="true"]:hover{background:var(--voltsoft)}.chip[aria-pressed="false"]:hover{background:#E9EBF2}.ghost:hover{background:#fff;box-shadow:0 0 0 2px var(--ink) inset}.btn:hover{filter:brightness(.96)}.seg button[aria-pressed="false"]:hover{color:var(--ink)}}
.ava{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.card .m{min-width:0;flex:1}
.card b{display:block;font-size:15.5px;line-height:1.25;font-weight:700}
.sub{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rate{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.rate em{font-style:normal;color:var(--ink);font-weight:800}
.side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.dist{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.st{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;transition:color .25s}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.free{color:var(--ok)}
.st.busy{color:var(--mute)}
.empty{padding:26px 8px;text-align:center;color:var(--mute)}
.empty .btn{margin-top:12px}

/* поля и кнопки */
.field,.send input,.ask input{width:100%;min-height:50px;border:1.5px solid transparent;background:var(--surf2);border-radius:18px;padding:0 16px;font-size:16px;transition:border-color .2s,background-color .2s}
.field:focus,.send input:focus,.ask input:focus,textarea:focus,.calc input:focus,.calc select:focus{border-color:var(--ink);outline:0;background:var(--surf)}
textarea{width:100%;min-height:90px;border:1.5px solid transparent;background:var(--surf2);border-radius:18px;padding:13px 16px;font-size:16px;resize:vertical;transition:border-color .2s,background-color .2s}
.btn{border:0;background:var(--volt);color:var(--ink);border-radius:18px;min-height:50px;padding:0 20px;font-weight:800;font-size:15px;transition:transform .15s var(--ease),filter .2s,opacity .2s}
.btn.line{background:var(--surf2);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.ask,.send{display:flex;gap:8px}
.ask{margin:2px 0 14px}

/* нормы */
.ans{border-radius:24px;padding:18px;background:var(--surf2);animation:pop .4s var(--ease)}
.ans .q{font-weight:800;margin:0 0 10px;font-size:15.5px}
.ans p{margin:0 0 10px;font-size:14.5px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ref{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:10px;background:var(--bluesoft);color:var(--blue)}
.demo{font-size:12px;color:var(--mute);margin-top:10px}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.doc{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);animation:pop .3s var(--ease) both}
.doc:last-child{border:0}
.doc .ic{flex:none;width:42px;height:50px;border-radius:10px;background:var(--bluesoft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:11px}
.doc b{display:block;font-size:15px;font-weight:700}
.doc span{font-size:13px;color:var(--mute)}
mark{background:var(--voltsoft);color:var(--ink);border-radius:3px;padding:0 2px;box-shadow:0 0 0 1px var(--volt)}

/* калькулятор */
.calc label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin:14px 0 6px}
.calc input,.calc select{width:100%;min-height:50px;border:1.5px solid transparent;background:var(--surf2);border-radius:16px;padding:0 14px;font:700 16px var(--font);font-variant-numeric:tabular-nums;transition:border-color .2s,background-color .2s}
.calc .seg{display:grid;margin-top:4px}
.calc .seg button{padding:8px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res{margin-top:20px;border-radius:26px;padding:20px;background:var(--volt);color:var(--ink)}
.res small{display:block;font-size:13px;font-weight:700;opacity:.7}
.res strong{display:block;margin:2px 0;font:600 32px/1.2 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.res em{display:block;margin-top:4px;font-style:normal;font-size:13px;font-weight:600;opacity:.75;min-height:1.5em}

/* чат */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;gap:12px;padding:2px 0 12px;box-shadow:0 1px 0 var(--line)}
.chathead .on{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mute)}
.chathead .on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding:14px 0;scrollbar-width:none}
.msg{max-width:80%;padding:10px 14px;border-radius:20px 20px 20px 6px;font-size:14.5px;background:var(--surf2)}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px}
.msg time{display:block;font-size:10.5px;opacity:.55;margin-top:2px}
.msg.pop{animation:pop .3s var(--ease)}
.send{padding-top:8px}

/* профиль исполнителя */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:22px;background:var(--surf2);margin:12px 0}
.sw{flex:none;width:52px;height:32px;border-radius:999px;border:0;background:var(--busy);position:relative;padding:0;transition:background-color .25s var(--ease)}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
input[type=range]{width:100%;height:30px;margin:0;-webkit-appearance:none;appearance:none;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--volt);border:3px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--volt);border:3px solid var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.tile{aspect-ratio:1;border-radius:20px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:11.5px;font-weight:700;line-height:1.25;color:#fff;position:relative;overflow:hidden;background-size:cover;background-position:center}
.tile.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.65))}
.tile span{position:relative}
.tile svg{position:absolute;right:8px;top:8px;width:28px;height:28px;opacity:.9}
.tile.new{animation:pop .4s var(--ease)}
.addrow{display:flex;gap:8px;margin-top:10px}
.thumb{flex:none;width:50px;height:50px;border-radius:14px;background:var(--surf2) center/cover}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--surf2);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

/* карточка специалиста: шторка снизу */
.sheet{position:absolute;inset:0;z-index:20;visibility:hidden;transition:visibility 0s .32s}
.sheet.open{visibility:visible;transition-delay:0s}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s ease}
.sheet.open .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--surf);border-radius:32px 32px 0 0;transform:translateY(102%);transition:transform .32s cubic-bezier(.4,0,.8,.4)}
.sheet.open .panel{transform:none;transition:transform .45s var(--ease)}
.panel.drag{transition:none!important}
.grab{flex:none;display:grid;place-items:center;height:32px;cursor:grab;touch-action:none}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.pbody{overflow-y:auto;overscroll-behavior:contain;padding:0 22px calc(22px + env(safe-area-inset-bottom))}
.phead{display:flex;gap:14px;align-items:center}
.phead .ava{width:60px;height:60px;font-size:18px}
.toast{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;transition:opacity .25s,transform .35s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* панель «Что где» */
.guide{position:sticky;top:16px;background:var(--surf);border-radius:30px;padding:28px 26px 18px;box-shadow:0 30px 60px -40px var(--shadow)}
.guide h2{margin:0 0 6px;font:600 21px/1.2 var(--display);letter-spacing:-.03em}
.guide p{margin:0 0 14px;color:var(--mute);font-size:14.5px}
.guide ol{list-style:none;margin:0;padding:0}
.guide li button{display:flex;gap:14px;width:100%;text-align:left;border:0;background:none;padding:12px 10px;border-radius:18px;transition:background-color .2s}
.guide li button[aria-current="true"],.guide li button:hover{background:var(--surf2)}
.guide li i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;font:800 12px var(--font);font-style:normal;margin-top:1px}
.guide li b{display:block;font-size:15px;font-weight:700}
.guide li span{display:block;font-size:13.5px;color:var(--mute)}
.guide .foot{margin-top:10px;padding:14px 10px 6px;font-size:13px;color:var(--mute);background:var(--surf2);border-radius:18px}
.gclose{display:none}

/* номера подсказок: любой элемент с data-pin получает метку, без JS */
[data-pin]{position:relative}
body.hints [data-pin]::after{content:attr(data-pin);position:absolute;left:-6px;top:-8px;z-index:6;width:22px;height:22px;border-radius:50%;background:var(--volt);color:var(--ink);font:800 11.5px/22px var(--font);text-align:center;box-shadow:0 0 0 3px var(--surf),0 0 0 4px rgba(18,20,28,.12);pointer-events:none}
body.hints .flabel[data-pin]::after,body.hints .count[data-pin]::after,body.hints .ttl[data-pin]::after,body.hints .chathead[data-pin]::after{left:auto;right:0;top:-3px}
body.hints .ask[data-pin]::after{top:-5px}
body.hints .tab[data-pin]::after{left:calc(50% + 8px);top:2px}
body.hints .map[data-pin]::after{left:10px;top:10px}
body.hints .seg[data-pin]::after{left:-8px;top:-10px}
body.hints .top .seg[data-pin]::after{box-shadow:0 0 0 3px var(--bg),0 0 0 4px rgba(18,20,28,.12)}

/* ПК: полноценное окно приложения, вкладки сверху, карта рядом со списком */
@media (min-width:901px){
 .screen{padding:8px 36px 40px}
 .ttl{font-size:28px;margin:8px 0 22px}
 .appbar{order:1;padding:22px 36px 12px}

function calcCalc(){const c=S.cv,k=Math.sqrt(3),f=c.ph===3?k:1,l=L(),u=XX().unit;let v,unit,lab,hint="",d;
 if(S.calc==="kwA"){v=c.P*1000/(f*c.U*c.cos);unit=u.A;lab=l.resI;d=1;if(c.P===7.4&&c.ph===1&&c.U===230)hint=l.hintI}
 else if(S.calc==="aKw"){v=f*c.U*c.I*c.cos/1000;unit=u.kW;lab=l.resP;d=2}
 else{const rho=c.mat==="cu"?.0175:.0282;v=rho*c.L*(c.loop?2:1)/c.S;unit=u.O;lab=l.resR;d=3;hint="ρ = "+(c.mat==="cu"?"0,0175":"0,0282")+" Ω·mm²/m"}
 return{v,unit,lab,hint,d}}
let shown={key:"",v:0},rafId=0;
function updateRes(){const r=calcCalc(),box=$("#res");if(!box)return;
 const ok=isFinite(r.v)&&r.v>=0;$("#resl").textContent=r.lab;$("#resh").textContent=ok?r.hint:XX().invalid;
 const out=$("#resv");cancelAnimationFrame(rafId);
 if(!ok){out.textContent="— "+r.unit;shown={key:S.calc,v:0};return}
 const same=shown.key===S.calc,from=same?shown.v:r.v,to=r.v,t0=performance.now(),dur=220;shown.key=S.calc;shown.v=to;
 clearTimeout(updateRes.fin);const final=()=>{out.textContent=fmt(to,r.d)+" "+r.unit};
 if(!same||from===to){final();return}
 const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);out.textContent=fmt(from+(to-from)*e,r.d)+" "+r.unit;if(k<1)rafId=requestAnimationFrame(step)};
 rafId=requestAnimationFrame(step);updateRes.fin=setTimeout(final,dur+40)}

 <div class="card" style="cursor:default"><span class="ava" style="background:#B35A1B">АГ</span><span class="m"><b>Алексей Громов</b><span class="sub">${esc(l.pro)}</span></span><span class="st ${S.free?"free":"busy"}" id="pst">${esc(S.free?x.statusOn:x.statusOff)}</span></div>
 <div class="toggle"><div><b>${esc(l.status)}</b><div class="rate">${esc(l.statusHint)}</div></div><button class="sw" id="sw" type="button" data-act="sw" role="switch" aria-checked="${S.free}" aria-label="${esc(l.status)}"></button></div>
 <label class="flabel" for="rad" style="display:block;margin-top:14px">${esc(l.radius)}: <b id="radv" style="color:var(--ink);font-weight:800">${S.rad} ${esc(l.km)}</b></label><input id="rad" type="range" min="5" max="80" step="5" value="${S.rad}" style="--p:${radPct()}">
 <label class="flabel" for="abt" style="display:block;margin-top:14px">${esc(l.about)}</label><textarea id="abt">${esc(S.about===null?l.aboutTxt:S.about)}</textarea></div><div class="pc">
 <h3>${esc(l.myWorks)}</h3><div class="tiles" id="mw">${worksOf(PRO[1])}</div>
 <h3>${esc(l.addW)}</h3><textarea id="wd" placeholder="${esc(l.wPh)}" aria-label="${esc(l.wDesc)}"></textarea>
 <div class="addrow"><input type="file" id="wfile" accept="image/*" hidden><span class="thumb" id="wprev" hidden></span><button class="btn line" type="button" data-act="wphoto">${esc(l.photo)}</button><button class="btn" id="wadd" type="button" data-act="wadd" style="flex:1">${esc(l.wAdd)}</button></div></div></div>`};

/* ---------- каркас ---------- */
const VIEWS={map:viewMap,norms:viewNorms,calc:viewCalc,chat:viewChat,profile:viewProfile};
function afterMount(){
 if(S.tab==="chat")scrollMsgs(false);
 if(S.tab==="calc"){shown={key:"",v:0};updateRes()}
 $$(".chips").forEach(ch=>{const sync=()=>ch.parentNode.classList.toggle("end",ch.scrollLeft+ch.clientWidth>=ch.scrollWidth-4);ch.addEventListener("scroll",sync,{passive:true});sync()})}
function show(anim,keep){const sc=$("#screen"),top=keep?sc.scrollTop:0;
 sc.dataset.tab=S.tab;sc.innerHTML=VIEWS[S.tab]();sc.scrollTop=top;
 sc.classList.remove("fwd","back","fade");if(anim){void sc.offsetWidth;sc.classList.add(anim)}
 afterMount()}
function syncSegs(){$$(".seg").forEach(sg=>{const b=$$("button",sg),i=b.findIndex(x=>x.getAttribute("aria-pressed")==="true");sg.style.setProperty("--n",b.length);sg.style.setProperty("--i",Math.max(0,i))})}
function renderTop(){const l=L();$("#bn").textContent=$("#ab").textContent=S.lang==="ru"?"Фаза":"Fase";$("#demotag").textContent=l.demo;$("#city").textContent=l.city;$("#rClient").textContent=l.client;$("#rPro").textContent=l.pro;$("#hintbtn .ht").textContent=l.hints;$("#hintbtn").setAttribute("aria-label",l.hints);$("#demotag2").textContent=l.demo;$("#gclose").textContent=XX().closeG;
 $$('[data-act="role"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.role));$$('[data-act="lang"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.lang));
 document.documentElement.lang=S.lang;$("#who").textContent=S.role==="client"?"АП":"АГ";syncSegs()}
function renderGuide(){const l=L();$("#gt").textContent=l.guideT;$("#gp").textContent=l.guideP;$("#gf").textContent=l.gfoot;
 $("#gl").innerHTML=l.g.map((g,i)=>`<li><button type="button" data-act="g" data-v="${i+1}" aria-current="${S.guideSel===i+1}"><i>${i+1}</i><span><b>${esc(g[0])}</b><span>${esc(g[1])}</span></span></button></li>`).join("")}
function go(tab){if(tab===S.tab){$("#screen").scrollTo({top:0,behavior:"smooth"});return}
 const prev=tabIdx(S.tab);closeSheet();S.tab=tab;renderTabs();show(tabIdx(tab)>=prev?"fwd":"back")}
function fullRender(anim,keep){closeSheet();renderTop();renderTabs();renderGuide();show(anim,keep)}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove("on"),1800)}
function setGuide(open){document.body.classList.toggle("guide-open",open&&mqNarrow.matches);$("#hintbtn").setAttribute("aria-pressed",open)}
function toggleGuide(){if(mqNarrow.matches){const open=!document.body.classList.contains("guide-open");setGuide(open)}
 else{S.hints=!S.hints;document.body.classList.toggle("hints",S.hints);document.body.classList.toggle("guide-off",!S.hints);$("#hintbtn").setAttribute("aria-pressed",S.hints)}}
function guideTo(n){S.guideSel=n;
 if(n===1)S.role="client";
 if(n>=2&&n<=4){S.role="client";S.tab="map"}
 if(n===5)S.tab="norms";if(n===6)S.tab="calc";if(n===7)S.tab="chat";
 if(n===8){S.role="pro";S.tab="profile"}
 if(S.role==="pro"&&S.tab==="map")S.tab="profile";
 if(S.role==="client"&&S.tab==="profile")S.tab="map";
 fullRender("fade");if(n===4)openSheet(S.sel);
 if(mqNarrow.matches)setGuide(false)}

/* ---------- события ---------- */
const ACT={
 role(b){if(S.role===b.dataset.v)return;S.role=b.dataset.v;S.tab=S.role==="client"?"map":"profile";fullRender("fade")},
 lang(b){if(S.lang===b.dataset.v)return;S.lang=b.dataset.v;fullRender(null,true)},
 hint(){toggleGuide()},
 tab(b){go(b.dataset.v)},
 f(b){S[b.dataset.k]=b.dataset.v;$$(".chip",b.parentNode).forEach(c=>c.setAttribute("aria-pressed",c===b));b.scrollIntoView({inline:"nearest",block:"nearest",behavior:"smooth"});updateFound()},
 reset(){S.room="all";S.work="all";$$(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v==="all"));updateFound()},
 pro(b){S.sel=b.dataset.v;$("#mapbox").innerHTML=mapInner(filtered());$$(".card[data-act=open]").forEach(c=>c.setAttribute("aria-current",c.dataset.v===S.sel));
  const g=$(`.mpin[data-v="${S.sel}"]`);if(g)g.focus({preventScroll:true});const c=$(`.card[data-v="${S.sel}"]`);if(c)c.scrollIntoView({block:"nearest",behavior:"smooth"})},
 open(b){S.sel=b.dataset.v;$$(".card[data-act=open]").forEach(c=>c.setAttribute("aria-current",c.dataset.v===S.sel));$("#mapbox").innerHTML=mapInner(filtered());openSheet(b.dataset.v)},
 close(){closeSheet()},
 chatwith(b){S.sel=b.dataset.v;closeSheet();S.tab="chat";renderTabs();show("fwd")},
 calc(b){S.calc=b.dataset.v;$$("#calcseg button").forEach(x=>x.setAttribute("aria-pressed",x===b));syncSegs();$("#calcbody").innerHTML=calcBody();updateRes()},
 g(b){guideTo(+b.dataset.v);renderGuide()},
 sw(b){S.free=!S.free;b.setAttribute("aria-checked",S.free);const st=$("#pst");st.textContent=S.free?XX().statusOn:XX().statusOff;st.className="st "+(S.free?"free":"busy")},
 wphoto(){$("#wfile").click()},
 wadd(){const wd=$("#wd"),t=wd.value.trim();if(!t){wd.classList.remove("shake");void wd.offsetWidth;wd.classList.add("shake");wd.focus();toast(XX().empty);return}
  S.myW=S.myW.concat([{t,img:S.draftImg}]);$("#mw").insertAdjacentHTML("beforeend",tile(t,"small",S.draftImg).replace('class="tile','class="tile new'));
  S.draftImg=null;wd.value="";$("#wfile").value="";$("#wprev").hidden=true;toast(XX().added);const last=$("#mw").lastElementChild;last&&last.scrollIntoView({block:"nearest",behavior:"smooth"})}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const f=ACT[b.dataset.act];if(f)f(b)});
document.addEventListener("keydown",e=>{
 const g=e.target.closest&&e.target.closest(".mpin");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();g.dispatchEvent(new MouseEvent("click",{bubbles:true}));return}
 if(e.key==="Escape"){if(S.sheet)closeSheet();else if(document.body.classList.contains("guide-open"))setGuide(false)}});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="askin"){S.q=t.value;return}
 if(t.id==="docin"){S.docq=t.value;$("#doclist").innerHTML=docList();return}
 if(t.id==="rad"){S.rad=+t.value;t.style.setProperty("--p",radPct());$("#radv").textContent=t.value+" "+L().km;return}
 if(t.id==="abt"){S.about=t.value;return}
 if(t.dataset&&t.dataset.k){const k=t.dataset.k;if(k==="mat")S.cv.mat=t.value;else if(k==="loop")S.cv.loop=t.value==="1";else S.cv[k]=parseFloat(t.value);updateRes()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="wfile"){const f=t.files&&t.files[0];if(!f)return;if(S.draftImg)URL.revokeObjectURL(S.draftImg);S.draftImg=URL.createObjectURL(f);const p=$("#wprev");p.style.backgroundImage=`url(${S.draftImg})`;p.hidden=false;return}
 if(t.dataset&&t.dataset.k){const k=t.dataset.k;if(k==="U"||k==="ph"||k==="cos"||k==="S")S.cv[k]=parseFloat(t.value);if(k==="mat")S.cv.mat=t.value;if(k==="loop")S.cv.loop=t.value==="1";updateRes()}});
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id;
 if(id==="sendf"){const i=$("#msgin"),v=i.value.trim();if(!v)return;i.value="";sendMsg(v);i.focus()}
 if(id==="askf"&&!S.asking){S.asking=true;S.ask=true;S.q=$("#askin").value;const slot=$("#ansslot"),btn=$("#askbtn");btn.disabled=true;
  slot.innerHTML='<div class="ans"><span class="dots" aria-label="…"><i></i><i></i><i></i></span></div>';
  setTimeout(()=>{S.asking=false;const s=$("#ansslot");if(s)s.innerHTML=ansHtml();const bb=$("#askbtn");if(bb)bb.disabled=false},700)}});
/* старт: на телефоне панель «Что где» закрыта и открывается по кнопке */
document.body.classList.toggle("hints",true);
$("#hintbtn").setAttribute("aria-pressed",!mqNarrow.matches);
fullRender(null);
/* старые браузеры: слушатель добавляем после первого рендера и только если он поддерживается */
const onMq=()=>{document.body.classList.remove("guide-open");document.body.classList.toggle("guide-off",!mqNarrow.matches&&!S.hints)};
if(mqNarrow.addEventListener)mqNarrow.addEventListener("change",onMq);else if(mqNarrow.addListener)mqNarrow.addListener(onMq);
})();
</script>
</body></html>
